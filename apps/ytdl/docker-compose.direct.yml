# Direct-egress variant — no VPN layer (VPN_MODE=off).
# For hosts whose own IP is fine for YouTube (residential). Datacenter hosts
# (EC2 etc.) must keep using the gluetun compose — YouTube blocks their IPs.
# Two workers instead of three: without per-worker VPN exit IPs there is no
# IP diversity to gain from a third.
# Requires .env with YTDL_INTERNAL_API_KEY and DATABASE_URL.
# Build the image locally first:  docker build -t hermitcraft-ytdl:direct .

services:
  manager:
    image: hermitcraft-ytdl:direct
    container_name: manager
    command: ["npx", "ts-node", "manager.ts"]
    ports:
      - "3001:3001"
    environment:
      - MANAGER_PORT=3001
      - VPN_MODE=off
      - POT_PROVIDER_URL=http://pot-provider:4416
      - YTDL_HOST=ytdl
      - YTDL_PORT=3001
      - WORKER_CONTAINERS=worker-1,worker-2
      - MANAGER_CONTAINER=manager
      - YTDL_CONTAINER=ytdl
      - REDIS_CONTAINER=redis
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc/meminfo:/host/proc/meminfo:ro
      - ./manager-data:/data
    networks:
      - ytdl-network
    restart: unless-stopped
    mem_limit: 512m

  ytdl:
    image: hermitcraft-ytdl:direct
    container_name: ytdl
    networks:
      - ytdl-network
    depends_on:
      redis:
        condition: service_started
    environment:
      - NODE_ENV=production
      - PORT=3001
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - YTDL_INTERNAL_API_KEY=${YTDL_INTERNAL_API_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - WORKER_ENDPOINTS=worker-1:3001,worker-2:3001
    restart: unless-stopped
    mem_limit: 640m

  worker-1:
    image: hermitcraft-ytdl:direct
    container_name: worker-1
    command: ["npx", "ts-node", "worker.ts"]
    environment:
      - WORKER_ID=worker-1
      - WORKER_PORT=3001
      - VPN_MODE=off
      - POT_PROVIDER_URL=http://pot-provider:4416
    networks:
      - ytdl-network
    restart: unless-stopped
    mem_limit: 768m

  worker-2:
    image: hermitcraft-ytdl:direct
    container_name: worker-2
    command: ["npx", "ts-node", "worker.ts"]
    environment:
      - WORKER_ID=worker-2
      - WORKER_PORT=3001
      - VPN_MODE=off
      - POT_PROVIDER_URL=http://pot-provider:4416
    networks:
      - ytdl-network
    restart: unless-stopped
    mem_limit: 768m

  # PO token provider. Without it YouTube answers the entire web client family
  # with "Only images are available", which collapses yt-dlp's usable client pool
  # down to one -- and a single client means a single point of failure (the
  # 8/19-8/20 outage). Keep its version in sync with POT_PLUGIN_VERSION in the
  # Dockerfile. Stateless; safe to restart at any time.
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.2
    container_name: pot-provider
    restart: unless-stopped
    mem_limit: 512m
    networks:
      - ytdl-network

  redis:
    image: redis:alpine
    container_name: redis
    command: ["redis-server", "--appendonly", "yes", "--dir", "/data"]
    volumes:
      - ./redis-data:/data
    restart: unless-stopped
    mem_limit: 128m
    networks:
      - ytdl-network

networks:
  ytdl-network:
    driver: bridge
